name: ProofLoop Framework Tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  framework-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Install Node.js dependencies
        run: npm ci
        working-directory: .agents/runtime
      - name: YAML frontmatter check
        run: python tests/framework/proofloop-check-agent-yaml.py
      - name: Permission smoke test
        run: python tests/framework/proofloop-permission-smoke-test.py
      - name: Build TypeScript
        run: npm run build
        working-directory: .agents/runtime
      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: .agents/runtime
      - name: TypeScript tests
        run: npm test
        working-directory: .agents/runtime
      - name: Check dist/ is up-to-date
        run: git diff --exit-code -- .agents/runtime/dist/
      - name: Check no untracked js files in dist/
        run: |
          untracked=$(git ls-files --others --exclude-standard .agents/runtime/dist/ | wc -l)
          if [ "$untracked" -ne 0 ]; then
            echo "Found $untracked untracked file(s) in dist/:"
            git ls-files --others --exclude-standard .agents/runtime/dist/
            exit 1
          fi

  flow-fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: .agents/runtime
      - name: Build TypeScript
        run: npm run build
        working-directory: .agents/runtime
      - name: Validate all checked-in fixture skeletons
        run: |
          for tasks in \
            ../../tests/fixtures/positive/delivery/stages/S00-POS/tasks.md \
            ../../tests/fixtures/cv/delivery/stages/S00-CV/tasks.md \
            ../../tests/fixtures/stage-gate/delivery/stages/S00-GATE/tasks.md \
            ../../tests/fixtures/continuation/delivery/stages/S00-CONT/tasks.md; do
            case "$tasks" in
              */positive/*) fixture_root=../../tests/fixtures/positive ;;
              */cv/*) fixture_root=../../tests/fixtures/cv ;;
              */stage-gate/*) fixture_root=../../tests/fixtures/stage-gate ;;
              */continuation/*) fixture_root=../../tests/fixtures/continuation ;;
            esac
            node scripts/fixture-check.mjs "$tasks" "$fixture_root"
          done
        working-directory: .agents/runtime
      - name: Validate checked-in negative fixtures reject intended condition
        run: |
          check_negative() {
            local tasks="$1"
            local fixture_root="$2"
            local expected_category="$3"
            local output
            local rc=0
            output=$(node scripts/fixture-check.mjs "$tasks" "$fixture_root" 2>&1) || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Expected fixture to fail validation: $tasks"
              exit 1
            fi
            if [[ "$output" != *"[$expected_category]"* ]]; then
              echo "Expected [$expected_category] for $tasks, got:"
              echo "$output"
              exit 1
            fi
            if [[ "$output" == *"[INVALID_EVIDENCE_PATH_PATTERN]"* ]]; then
              echo "Negative fixture failed for a non-intended evidence path condition: $tasks"
              exit 1
            fi
            echo "Confirmed [$expected_category]: $tasks"
          }
          check_negative \
            ../../tests/fixtures/negative/incomplete-worker/delivery/stages/S00-INCOMPLETE/tasks.md \
            ../../tests/fixtures/negative/incomplete-worker \
            INCOMPLETE_WORKER
          check_negative \
            ../../tests/fixtures/negative/missing-po/delivery/stages/S00-NOPO/tasks.md \
            ../../tests/fixtures/negative/missing-po \
            MISSING_PROOF_OBLIGATION
        working-directory: .agents/runtime
      - name: Scenario 2 dispatch mismatch acceptance
        run: python tests/fixtures/dispatch-mismatch/scenario-2-dispatch-mismatch.py
      - name: Ensure fixture checks are read-only
        run: git diff --exit-code -- tests/fixtures
      - name: Shell smoke test (compile, validate, gate, cleanup)
        run: bash tests/framework/proofloop-smoke-test.sh
