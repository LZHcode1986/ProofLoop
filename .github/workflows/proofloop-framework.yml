name: ProofLoop Framework Tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  framework-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Install Node.js dependencies
        run: npm ci
        working-directory: .agents/runtime
      - name: YAML frontmatter check
        run: python tests/framework/proofloop-check-agent-yaml.py
      - name: Permission smoke test
        run: python tests/framework/proofloop-permission-smoke-test.py
      - name: Build TypeScript
        run: npm run build
        working-directory: .agents/runtime
      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: .agents/runtime
      - name: TypeScript tests
        run: npm test
        working-directory: .agents/runtime
      - name: Check dist/ is up-to-date
        run: git diff --exit-code -- .agents/runtime/dist/
      - name: Check no untracked js files in dist/
        run: |
          untracked=$(git ls-files --others --exclude-standard .agents/runtime/dist/ | wc -l)
          if [ "$untracked" -ne 0 ]; then
            echo "Found $untracked untracked file(s) in dist/:"
            git ls-files --others --exclude-standard .agents/runtime/dist/
            exit 1
          fi

  flow-fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: .agents/runtime
      - name: Build TypeScript
        run: npm run build
        working-directory: .agents/runtime
      - name: Validate positive fixture
        run: node scripts/fixture-check.mjs ../../tests/fixtures/positive/tasks.md
        working-directory: .agents/runtime
      - name: Validate SCV fixture
        run: node scripts/fixture-check.mjs ../../tests/fixtures/scv/tasks.md
        working-directory: .agents/runtime
      - name: Validate Stage Gate fixture
        run: node scripts/fixture-check.mjs ../../tests/fixtures/stage-gate/tasks.md
        working-directory: .agents/runtime
      - name: Validate Continuation fixture
        run: node scripts/fixture-check.mjs ../../tests/fixtures/continuation/tasks.md
        working-directory: .agents/runtime
